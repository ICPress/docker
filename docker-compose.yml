services:
  redis:
    image: redis
    restart: unless-stopped
    ports:
      - 6379:6379

  mysql:
    image: mysql:9.7.0
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: gorse
      MYSQL_USER: gorse
      MYSQL_PASSWORD: gorse_pass
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d/:ro

  gorse-worker:
    image: zhenghaoz/gorse-worker:0.5.7
    restart: unless-stopped
    ports:
      - 8089:8089
    command: >
      --master-host gorse-master --master-port 8086 
      --http-host 0.0.0.0 --http-port 8089
      --log-path /var/log/gorse/worker.log 
      --cache-path /var/lib/gorse/worker_cache.data
    volumes:
      - ./gorse_log:/var/log/gorse
      - ./gorse_worker_data:/var/lib/gorse
    depends_on:
      - gorse-master

  gorse-server:
    image: zhenghaoz/gorse-server:0.5.7
    restart: unless-stopped
    ports:
      - 8087:8087
    command: >
      --master-host gorse-master --master-port 8086 
      --http-host 0.0.0.0 --http-port 8087
      --log-path /var/log/gorse/server.log 
      --cache-path /var/lib/gorse/server_cache.data
    volumes:
      - ./gorse_log:/var/log/gorse
      - ./gorse_server_data:/var/lib/gorse
    depends_on:
      - gorse-master

  apache-ignite:
    image: apacheignite/ignite:2.18.0
    restart: unless-stopped
    ports:
      - 10800:10800
    environment:
      IGNITE_WORK_DIR: /storage,
      CONFIG_URI: /ignite_config.xml
    volumes:
      - ./ignite_config.xml:/ignite_config.xml
      - ./ignite_storage:/storage
          
  gorse-master:
    image: zhenghaoz/gorse-master:0.5.7
    restart: unless-stopped
    ports:
      - 8086:8086
      - 8088:8088
    environment:
      GORSE_CACHE_STORE: redis://redis:6379/0
      GORSE_DATA_STORE: mysql://gorse:gorse_pass@tcp(mysql:3306)/gorse
      GORSE_BLOB_URI: /var/lib/gorse/blob
    command: >
      -c /etc/gorse/config.toml 
      --log-path /var/log/gorse/master.log 
      --cache-path /var/lib/gorse/master
    volumes:
      - ./config.toml:/etc/gorse/config.toml
      - ./gorse_log:/var/log/gorse
      - ./gorse_master_data:/var/lib/gorse/master
      - ./gorse_blob_data:/var/lib/gorse/blob
    depends_on:
      - redis
      - mysql
          
  openstack-swift:
    image: openstackswift/saio
    restart: unless-stopped
    ports:
      - 8080:8080
          
  icpress-mailplatform:
    image: icpress/mailplatform:1.0
    restart: unless-stopped
    volumes:
      - ./appsettings.json:/app/appsettings.json
      - ..:/workspaces/icpress-mailplatform
    depends_on:
      - redis
      - mysql
      - apache-ignite
      - gorse-master
      
  icpress-eventplatform:
    image: icpress/eventplatform:1.0
    restart: unless-stopped
    volumes:
      - ./appsettings.json:/app/appsettings.json
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json
      - ..:/workspaces/icpress-eventplatform
    depends_on:
      - redis
      - mysql
      - apache-ignite
      - gorse-master
      
  icpress-spacy:
    image: icpress/icpress-spacy:1.0
    restart: unless-stopped
    ports:
      - 5050:5050
      
  icpress-apiplatform:
    image: icpress/apiplatform:1.0
    restart: unless-stopped
    ports:
      - 5110:5110
    volumes:
      - ./appsettings.json:/app/appsettings.json
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json
      - ..:/workspaces/icpress-apiplatform 
    depends_on:
      - redis
      - mysql
      - apache-ignite
      - gorse-master
      - icpress-spacy
      
  icpress-siteplatform:
    image: icpress/apiplatform:1.0
    restart: unless-stopped
    ports:
      - 5111:5111
    volumes:
      - ./appsettings.json:/app/appsettings.json
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json
      - ..:/workspaces/siteplatform
    depends_on:
      - redis
      - mysql
      - apache-ignite
      - gorse-master
      - icpress-apiplatform
      

volumes:
  mysql_data:
  gorse_worker_data:
  gorse_server_data:
  gorse_master_data:
  gorse_log:
